<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>{{ page.title }} · {{ site.title }}</title>
    {% seo %}
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 40px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
      }
      .topbar-mark {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 6px;
        color: var(--accent);
        text-transform: uppercase;
        text-decoration: none;
      }
      .topbar-nav { display: flex; gap: 24px; }
      .topbar-link {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.2s, border-color 0.2s;
      }
      .topbar-link:hover,
      .topbar-link.is-active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .page {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 40px 80px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 80px;
      }
      .section { margin-bottom: 0; }
      .section-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 28px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .section-lead {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
        margin: -12px 0 32px;
        max-width: 480px;
      }
      .pitch-question {
        font-family: var(--sans);
        font-size: 34px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.25;
        letter-spacing: -0.4px;
        max-width: 720px;
        margin-bottom: 20px;
      }
      .pitch-body {
        font-size: 16px;
        line-height: 1.75;
        color: var(--muted);
        max-width: 640px;
        margin-bottom: 14px;
      }
      .pitch-body:last-child { margin-bottom: 0; }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }
      .cards-2 { grid-template-columns: repeat(2, 1fr); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 8px 32px rgba(0, 229, 160, 0.08);
      }
      .card-icon {
        font-family: var(--mono);
        font-size: 20px;
        color: var(--accent);
        margin-bottom: 16px;
        transition: transform 0.3s;
      }
      .card:hover .card-icon { transform: scale(1.15); }
      .card-title {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
      .card-desc {
        font-size: 14px;
        line-height: 1.65;
        color: var(--muted);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px 20px;
        text-align: center;
        transition: border-color 0.3s, transform 0.3s;
      }
      .stat:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .stat-value {
        display: block;
        font-family: var(--mono);
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      .stat-label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.4;
      }
      .certifications {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .cert {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        text-align: center;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      .cert:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(0, 229, 160, 0.06);
      }
      .cert-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.5px;
        line-height: 1.3;
      }
      .cert-tag {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        line-height: 1.4;
      }
      .site-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 0 0 64px;
      }
      .glider {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        opacity: 0.9;
      }
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 0.7s ease var(--delay, 0ms),
                    transform 0.7s ease var(--delay, 0ms);
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }

      @media (max-width: 700px) {
        .cards { grid-template-columns: 1fr; }
        .cards-2 { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
        .certifications { grid-template-columns: repeat(2, 1fr); }
        .pitch-question { font-size: 26px; }
      }
      @media (max-width: 600px) {
        .topbar { padding: 24px; }
        .page { padding: 12px 24px 64px; gap: 56px; }
        .certifications { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
        .pitch-question { font-size: 24px; }
        .topbar-nav { gap: 14px; }
        .topbar-link { font-size: 9px; letter-spacing: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        .reveal { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-mark" href="/">MOZENT&#x25B3;I</a>
      <nav class="topbar-nav">
        <a class="topbar-link is-active" href="/about/">About</a>
        <a class="topbar-link" href="/professionals/">Professionals</a>
        <a class="topbar-link" href="/hire/">Get in touch</a>
      </nav>
    </header>

    <main class="page">
      {% include stats.html %}
      {% include services.html %}
      {% include certifications.html %}
    </main>

    <footer class="site-footer">
      <picture>
        <source srcset="/assets/glider.png" media="(prefers-reduced-motion: reduce)">
        <img class="glider" src="/assets/glider.gif" alt="Conway glider, the hacker emblem" width="56" height="56">
      </picture>
    </footer>

    <script>
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });

      function formatStatValue(n, suffix) {
        var rounded = Math.round(n);
        if (suffix === '%') return rounded + '%';
        return rounded.toLocaleString('en-US') + (suffix || '');
      }
      function animateStat(el) {
        if (el.dataset.counted) return;
        el.dataset.counted = 'true';
        var target = parseFloat(el.dataset.target);
        var suffix = el.dataset.suffix || '';
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || isNaN(target)) {
          el.textContent = formatStatValue(target, suffix);
          return;
        }
        var duration = 2000;
        var start = null;
        function step(ts) {
          if (!start) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = formatStatValue(target * eased, suffix);
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      var statObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            animateStat(entry.target);
            statObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.4 });
      document.querySelectorAll('.stat-value[data-target]').forEach(function (el) {
        statObserver.observe(el);
      });
    </script>
  </body>
</html>
