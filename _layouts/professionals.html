<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>{{ page.title }} · {{ site.title }}</title>
    {% seo %}
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 40px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
      }
      .topbar-mark {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 6px;
        color: var(--accent);
        text-transform: uppercase;
        text-decoration: none;
      }
      .topbar-nav { display: flex; gap: 24px; }
      .topbar-link {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.2s, border-color 0.2s;
      }
      .topbar-link:hover,
      .topbar-link.is-active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .page {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 40px 80px;
        flex: 1;
      }
      .section-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent);
      }
      .wall-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0;
      }
      .wall-lookup {
        width: 280px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .wall-lookup:focus { border-color: var(--accent); }
      .wall-lookup::placeholder { color: var(--muted); }
      .wall-list {
        display: flex;
        flex-direction: column;
      }
      .wall-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
        align-items: center;
        transition: background 0.15s;
      }
      .wall-row:hover { background: rgba(0, 229, 160, 0.03); }
      .wall-row-name {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
      }
      .wall-row-hex {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        letter-spacing: 1px;
      }
      .wall-row-titles {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        letter-spacing: 0.5px;
      }
      .wall-empty {
        font-size: 13px;
        color: var(--muted);
        padding: 24px 0;
      }
      .wall-empty.is-hidden,
      .wall-row[hidden] { display: none; }
      .wall-ladder {
        margin-top: 64px;
      }
      .wall-subhead {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .ladder-grid {
        display: flex;
        gap: 12px;
      }
      .ladder-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: border-color 0.2s;
      }
      .ladder-item:hover { border-color: var(--accent); }
      .ladder-item[hidden] { display: none; }
      .ladder-code {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 1px;
      }
      .ladder-name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        letter-spacing: 0.5px;
      }
      .site-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 0 64px;
      }
      .glider {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        opacity: 0.9;
      }

      @media (max-width: 700px) {
        .wall-header { flex-direction: column; align-items: flex-start; }
        .wall-lookup { width: 100%; }
        .wall-row { grid-template-columns: 1fr; gap: 4px; }
        .wall-row-titles { text-align: left; }
        .ladder-grid { flex-direction: column; }
      }
      @media (max-width: 600px) {
        .topbar { padding: 24px; }
        .page { padding: 12px 24px 64px; }
        .topbar-nav { gap: 14px; }
        .topbar-link { font-size: 9px; letter-spacing: 2px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-mark" href="/">MOZENT&#x25B3;I</a>
      <nav class="topbar-nav">
        <a class="topbar-link" href="/about/">About</a>
        <a class="topbar-link is-active" href="/professionals/">Professionals</a>
        <a class="topbar-link" href="/hire/">Get in touch</a>
      </nav>
    </header>

    <main class="page">
      {% include career.html %}
    </main>

    <footer class="site-footer">
      <picture>
        <source srcset="/assets/glider.png" media="(prefers-reduced-motion: reduce)">
        <img class="glider" src="/assets/glider.gif" alt="Conway glider, the hacker emblem" width="56" height="56">
      </picture>
    </footer>

    <script src="/assets/js/career.js"></script>
  </body>
</html>
