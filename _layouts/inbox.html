<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    {% include head-security.html %}
    <meta name="robots" content="noindex, nofollow">
    <title>404</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        min-height: 100vh;
        color: var(--text);
      }
      .gate {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .error {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
        gap: 24px;
        user-select: none;
        -webkit-user-select: none;
        text-align: center;
      }
      .wordmark {
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: 10px;
        color: var(--accent);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
        background: none;
        border: none;
        cursor: pointer;
      }
      .message {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1.6;
        max-width: 420px;
      }
      .home {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      .home:hover { border-bottom-color: var(--accent); }
      .inbox {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 32px 80px;
      }
      .inbox-bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 32px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .inbox-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent);
      }
      .sign-out {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        background: none;
        border: none;
        cursor: pointer;
      }
      .sign-out:hover { color: var(--accent); }
      .request {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
      }
      .request-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .request-sub {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 14px;
        letter-spacing: 0.4px;
      }
      .request-body {
        font-size: 15px;
        line-height: 1.7;
        color: var(--text);
        white-space: pre-wrap;
      }
      .request-empty {
        font-size: 14px;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .wordmark { font-size: 30px; letter-spacing: 5px; }
        .message  { font-size: 11px; letter-spacing: 2px; }
        .inbox { padding: 32px 20px 64px; }
      }
    </style>
  </head>
  <body>
    <div class="gate" id="gate">
      <div class="error">
        <button class="wordmark" id="wordmark" type="button">MOZENT<span style="font-size:1.18em;vertical-align:0.04em;">&#x25B3;</span>I</button>
        <p class="message" id="message">Got lost on the way home?</p>
        <a class="home" href="/">Back home</a>
      </div>
    </div>

    <main class="inbox" id="inbox" hidden>
      <div class="inbox-bar">
        <h1 class="inbox-title">Requests</h1>
        <button class="sign-out" id="sign-out" type="button">Sign out</button>
      </div>
      <p class="request-empty" id="request-empty" hidden>No requests yet.</p>
      <div id="request-list"></div>
    </main>

    <script src="/assets/js/firebase-config.js"></script>
    <script type="module" src="/assets/js/inbox.js"></script>
    <script>
      document.fonts.ready.then(function () {
        var wm  = document.getElementById('wordmark');
        var msg = document.getElementById('message');
        if (!wm || !msg) return;
        var target = msg.offsetWidth;
        var size = 40;
        wm.style.fontSize = size + 'px';
        while (wm.offsetWidth < target && size < 300) {
          size += 0.5;
          wm.style.fontSize = size + 'px';
        }
        while (wm.offsetWidth > target && size > 10) {
          size -= 0.5;
          wm.style.fontSize = size + 'px';
        }
      });
    </script>
  </body>
</html>
