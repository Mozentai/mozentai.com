<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        min-height: 100vh;
        color: var(--text);
      }
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 60px 40px 80px;
      }
      .landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        user-select: none;
        -webkit-user-select: none;
        margin-bottom: 72px;
      }
      .wordmark {
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: 10px;
        color: var(--accent);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .tagline {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .section {
        margin-bottom: 64px;
      }
      .section-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 28px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        transition: border-color 0.2s;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card-icon {
        font-family: var(--mono);
        font-size: 20px;
        color: var(--accent);
        margin-bottom: 16px;
      }
      .card-title {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
      .card-desc {
        font-size: 14px;
        line-height: 1.65;
        color: var(--muted);
      }
      .partners {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .partner {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: border-color 0.2s;
      }
      .partner:hover {
        border-color: var(--accent);
      }
      .partner-name {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
      }
      .partner-tag {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @media (max-width: 700px) {
        .tagline { font-size: 1.8vw; letter-spacing: 0.5vw; }
        .cards { grid-template-columns: 1fr; }
        .partners { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 600px) {
        .page { padding: 40px 24px 60px; }
        .wordmark { font-size: 30px; letter-spacing: 5px; }
        .tagline  { font-size: 10px; letter-spacing: 2px; }
        .partners { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="landing">
        <div class="wordmark">MOZENT<span style="font-size:1.18em;vertical-align:0.04em;">&#x25B3;</span>I</div>
        <div class="tagline">CyberSec Specialists, Hackers @ Work</div>
      </div>

      {% include services.html %}
      {% include partners.html %}
    </div>

    <script>
      document.fonts.ready.then(function () {
        var wm  = document.querySelector('.wordmark');
        var tag = document.querySelector('.tagline');
        var target = tag.offsetWidth;
        var size = 40;
        wm.style.fontSize = size + 'px';
        while (wm.offsetWidth < target && size < 300) {
          size += 0.5;
          wm.style.fontSize = size + 'px';
        }
        while (wm.offsetWidth > target && size > 10) {
          size -= 0.5;
          wm.style.fontSize = size + 'px';
        }
      });
    </script>
  </body>
</html>
