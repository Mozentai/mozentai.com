<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--text);
      }

      /* ── Hero ── */
      .hero {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        user-select: none;
        -webkit-user-select: none;
      }
      .wordmark {
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: 10px;
        color: var(--accent);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .tagline {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .scroll-hint {
        position: absolute;
        bottom: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: fadeUp 1s ease 1.2s both;
        z-index: 1;
      }
      .scroll-hint span {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.6;
      }
      .scroll-chevron {
        width: 18px;
        height: 18px;
        border-right: 1.5px solid var(--accent);
        border-bottom: 1.5px solid var(--accent);
        transform: rotate(45deg);
        opacity: 0.5;
        animation: bounce 2s ease-in-out infinite;
      }

      /* ── Below fold ── */
      .below {
        max-width: 960px;
        margin: 0 auto;
        padding: 80px 40px 80px;
        display: flex;
        flex-direction: column;
        gap: 112px;
      }
      .section {
        margin-bottom: 0;
      }
      .section-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 28px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 8px 32px rgba(0, 229, 160, 0.08);
      }
      .card-icon {
        font-family: var(--mono);
        font-size: 20px;
        color: var(--accent);
        margin-bottom: 16px;
        transition: transform 0.3s;
      }
      .card:hover .card-icon {
        transform: scale(1.15);
      }
      .card-title {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
      .card-desc {
        font-size: 14px;
        line-height: 1.65;
        color: var(--muted);
      }
      .section-lead {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
        margin: -12px 0 32px;
        max-width: 480px;
      }
      .pitch-question {
        font-family: var(--sans);
        font-size: 34px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.25;
        letter-spacing: -0.4px;
        max-width: 720px;
        margin-bottom: 20px;
      }
      .pitch-body {
        font-size: 16px;
        line-height: 1.75;
        color: var(--muted);
        max-width: 640px;
        margin-bottom: 14px;
      }
      .pitch-body:last-child {
        margin-bottom: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px 20px;
        text-align: center;
        transition: border-color 0.3s, transform 0.3s;
      }
      .stat:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .stat-value {
        display: block;
        font-family: var(--mono);
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
        line-height: 1.2;
        margin-bottom: 10px;
      }
      .stat-label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.4;
      }
      .testimonials {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }
      .testimonial {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 28px;
        margin: 0;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      .testimonial:hover {
        border-color: rgba(0, 229, 160, 0.35);
        box-shadow: 0 8px 32px rgba(0, 229, 160, 0.06);
      }
      .testimonial-quote {
        font-size: 14px;
        line-height: 1.75;
        color: var(--text);
        margin: 0 0 20px;
      }
      .testimonial-quote::before {
        content: "\201C";
        font-family: Georgia, serif;
        font-size: 28px;
        color: var(--accent);
        opacity: 0.5;
        line-height: 0;
        display: block;
        margin-bottom: 12px;
      }
      .testimonial-author {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .testimonial-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.5px;
      }
      .testimonial-role {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .leader {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 40px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      .leader:hover {
        border-color: rgba(0, 229, 160, 0.45);
        box-shadow: 0 8px 32px rgba(0, 229, 160, 0.06);
      }
      .leader-photo {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 18%;
        border: 2px solid var(--accent);
        display: block;
      }
      .leader-role {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .leader-name {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 16px;
        letter-spacing: 1px;
      }
      .leader-bio {
        font-size: 14px;
        line-height: 1.75;
        color: var(--muted);
        margin: 0;
      }
      .marquee-wrap {
        position: relative;
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
        padding: 8px 0;
      }
      .marquee {
        overflow: hidden;
      }
      .marquee-track {
        display: flex;
        align-items: center;
        width: max-content;
        gap: 72px;
        animation: marquee 36s linear infinite;
      }
      .marquee-wrap:hover .marquee-track {
        animation-play-state: paused;
      }
      .marquee-item {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 8px;
      }
      .marquee-logo {
        height: 32px;
        width: auto;
        max-width: 220px;
        object-fit: contain;
        opacity: 0.72;
        transition: opacity 0.3s;
      }
      .marquee-item:hover .marquee-logo {
        opacity: 0.95;
      }
      .marquee-fade {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 120px;
        z-index: 1;
        pointer-events: none;
      }
      .marquee-fade--left {
        left: 0;
        background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
      }
      .marquee-fade--right {
        right: 0;
        background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      .certifications {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .cert {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        text-align: center;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      .cert:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(0, 229, 160, 0.06);
      }
      .cert-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.5px;
        line-height: 1.3;
      }
      .cert-tag {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        line-height: 1.4;
      }
      .site-footer {
        display: flex;
        justify-content: center;
        padding: 0 0 64px;
      }
      .glider {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        opacity: 0.9;
      }

      /* ── Scroll reveal ── */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 0.7s ease var(--delay, 0ms),
                    transform 0.7s ease var(--delay, 0ms);
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── Keyframes ── */
      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes glow {
        0%, 100% { text-shadow: 0 0 20px rgba(0, 229, 160, 0); }
        50%      { text-shadow: 0 0 30px rgba(0, 229, 160, 0.25); }
      }
      @keyframes bounce {
        0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.5; }
        50%      { transform: rotate(45deg) translateY(6px); opacity: 0.9; }
      }

      @media (max-width: 700px) {
        .tagline { font-size: 1.8vw; letter-spacing: 0.5vw; }
        .cards { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
        .testimonials { grid-template-columns: 1fr; }
        .marquee-track { gap: 48px; animation-duration: 28s; }
        .marquee-fade { width: 64px; }
        .certifications { grid-template-columns: repeat(2, 1fr); }
        .pitch-question { font-size: 26px; }
        .leader {
          grid-template-columns: 1fr;
          justify-items: center;
          text-align: center;
          gap: 24px;
          padding: 28px 24px;
        }
      }
      @media (max-width: 600px) {
        .below { padding: 60px 24px 48px; gap: 80px; }
        .wordmark { font-size: 30px; letter-spacing: 5px; }
        .tagline  { font-size: 10px; letter-spacing: 2px; }
        .marquee-logo { height: 26px; }
        .certifications { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
        .pitch-question { font-size: 24px; }
        .leader-photo { width: 160px; height: 160px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        .reveal { opacity: 1; transform: none; }
        .marquee-track {
          animation: none;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
          gap: 24px 40px;
          padding: 0 24px;
        }
        .marquee-wrap {
          width: 100%;
          margin-left: 0;
        }
        .marquee-fade { display: none; }
        .marquee-item[aria-hidden="true"] { display: none; }
        .marquee-logo { opacity: 0.75; }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="landing">
        <div class="wordmark">MOZENT<span style="font-size:1.18em;vertical-align:0.04em;">&#x25B3;</span>I</div>
        <div class="tagline">CyberSec Specialists, Hackers @ Work</div>
      </div>
      <a class="scroll-hint" href="#pitch" aria-label="Scroll to audit pitch">
        <span>Explore</span>
        <div class="scroll-chevron"></div>
      </a>
    </section>

    <div class="below">
      {% include pitch.html %}
      {% include stats.html %}
      {% include services.html %}
      {% include leadership.html %}
      {% include clients.html %}
      {% include certifications.html %}
      {% include testimonials.html %}
    </div>

    <footer class="site-footer">
      <picture>
        <source srcset="/assets/glider.png" media="(prefers-reduced-motion: reduce)">
        <img class="glider" src="/assets/glider.gif" alt="Conway glider, the hacker emblem" width="56" height="56">
      </picture>
    </footer>

    <script>
      document.fonts.ready.then(function () {
        var wm  = document.querySelector('.wordmark');
        var tag = document.querySelector('.tagline');
        var target = tag.offsetWidth;
        var size = 40;
        wm.style.fontSize = size + 'px';
        while (wm.offsetWidth < target && size < 300) {
          size += 0.5;
          wm.style.fontSize = size + 'px';
        }
        while (wm.offsetWidth > target && size > 10) {
          size -= 0.5;
          wm.style.fontSize = size + 'px';
        }
      });

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });

      function formatStatValue(n, suffix) {
        var rounded = Math.round(n);
        if (suffix === '%') return rounded + '%';
        return rounded.toLocaleString('en-US') + (suffix || '');
      }

      function animateStat(el) {
        if (el.dataset.counted) return;
        el.dataset.counted = 'true';
        var target = parseFloat(el.dataset.target);
        var suffix = el.dataset.suffix || '';
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || isNaN(target)) {
          el.textContent = formatStatValue(target, suffix);
          return;
        }
        var duration = 2000;
        var start = null;
        function step(ts) {
          if (!start) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = formatStatValue(target * eased, suffix);
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      var statObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            animateStat(entry.target);
            statObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.4 });

      document.querySelectorAll('.stat-value[data-target]').forEach(function (el) {
        statObserver.observe(el);
      });
    </script>
  </body>
</html>
