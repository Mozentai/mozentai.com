<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --accent: #00e5a0;
        --muted: #5a6b82;
        --text: #c9d1d9;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--text);
      }

      .hero {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        user-select: none;
        -webkit-user-select: none;
      }
      .wordmark {
        font-family: var(--mono);
        font-weight: 700;
        font-size: clamp(48px, 9vw, 88px);
        letter-spacing: 10px;
        color: var(--accent);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .tagline {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }
      .hero-nav {
        display: flex;
        gap: 32px;
        margin-top: 28px;
      }
      .hero-nav a {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.2s, border-color 0.2s;
      }
      .hero-nav a:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .scroll-hint {
        position: absolute;
        bottom: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: fadeUp 1s ease 1.2s both;
        z-index: 1;
      }
      .scroll-chevron {
        width: 18px;
        height: 18px;
        border-right: 1.5px solid var(--accent);
        border-bottom: 1.5px solid var(--accent);
        transform: rotate(45deg);
        opacity: 0.5;
        animation: bounce 2s ease-in-out infinite;
      }

      .below {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 40px 80px;
      }
      .section { margin-bottom: 0; }
      .marquee-wrap {
        position: relative;
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
        padding: 8px 0;
      }
      .marquee { overflow: hidden; }
      .marquee-track {
        display: flex;
        align-items: center;
        width: max-content;
        gap: 72px;
        animation: marquee 36s linear infinite;
      }
      .marquee-wrap:hover .marquee-track { animation-play-state: paused; }
      .marquee-item {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 8px;
      }
      .marquee-logo {
        height: 32px;
        width: auto;
        max-width: 220px;
        object-fit: contain;
        opacity: 0.72;
        transition: opacity 0.3s;
      }
      .marquee-item:hover .marquee-logo { opacity: 0.95; }
      .marquee-fade {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 120px;
        z-index: 1;
        pointer-events: none;
      }
      .marquee-fade--left {
        left: 0;
        background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
      }
      .marquee-fade--right {
        right: 0;
        background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      .site-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 0 0 64px;
      }
      .glider {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        opacity: 0.9;
      }

      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 0.7s ease var(--delay, 0ms),
                    transform 0.7s ease var(--delay, 0ms);
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes bounce {
        0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.5; }
        50%      { transform: rotate(45deg) translateY(6px); opacity: 0.9; }
      }

      @media (max-width: 700px) {
        .tagline { font-size: 1.8vw; letter-spacing: 0.5vw; }
        .marquee-track { gap: 48px; animation-duration: 28s; }
        .marquee-fade { width: 64px; }
        .hero-nav { gap: 20px; }
      }
      @media (max-width: 600px) {
        .below { padding: 24px 24px 48px; }
        .wordmark { letter-spacing: 6px; }
        .tagline  { font-size: 10px; letter-spacing: 2px; }
        .marquee-logo { height: 26px; }
        .hero-nav { gap: 16px; }
        .hero-nav a { font-size: 9px; letter-spacing: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        .reveal { opacity: 1; transform: none; }
        .marquee-track {
          animation: none;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
          gap: 24px 40px;
          padding: 0 24px;
        }
        .marquee-wrap { width: 100%; margin-left: 0; }
        .marquee-fade { display: none; }
        .marquee-item[aria-hidden="true"] { display: none; }
        .marquee-logo { opacity: 0.75; }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="landing">
        <div class="wordmark">MOZENT<span style="font-size:1.18em;vertical-align:0.04em;">&#x25B3;</span>I</div>
        <div class="tagline">Engineers @ Work</div>
        <nav class="hero-nav">
          <a href="/about/">About</a>
          <a href="/professionals/">Professionals</a>
          <a href="/hire/">Get in touch</a>
        </nav>
      </div>
      <a class="scroll-hint" href="#clients" aria-label="Scroll to clients">
        <div class="scroll-chevron"></div>
      </a>
    </section>

    <div class="below">
      {% include clients.html %}
    </div>

    <footer class="site-footer">
      <picture>
        <source srcset="/assets/glider.png" media="(prefers-reduced-motion: reduce)">
        <img class="glider" src="/assets/glider.gif" alt="Conway glider, the hacker emblem" width="56" height="56">
      </picture>
    </footer>

    <script>
      function fitHeroLockup() {
        var wm  = document.querySelector('.wordmark');
        var tag = document.querySelector('.tagline');
        if (!wm || !tag) return;
        var target = Math.min(window.innerWidth * 0.86, 560);
        var size = 24;
        wm.style.fontSize = size + 'px';
        while (wm.offsetWidth < target && size < 160) {
          size += 0.5;
          wm.style.fontSize = size + 'px';
        }
        while (wm.offsetWidth > target && size > 24) {
          size -= 0.5;
          wm.style.fontSize = size + 'px';
        }
        var tracking = 2;
        tag.style.letterSpacing = tracking + 'px';
        while (tag.offsetWidth < wm.offsetWidth && tracking < 40) {
          tracking += 0.25;
          tag.style.letterSpacing = tracking + 'px';
        }
        while (tag.offsetWidth > wm.offsetWidth && tracking > 1) {
          tracking -= 0.25;
          tag.style.letterSpacing = tracking + 'px';
        }
      }
      document.fonts.ready.then(function () {
        fitHeroLockup();
        window.addEventListener('resize', fitHeroLockup);
      });

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });
    </script>
  </body>
</html>
