<section class="section reveal" id="partners">
  <h2 class="section-title">Partners</h2>
  <div class="marquee-wrap">
    <div class="marquee-fade marquee-fade--left" aria-hidden="true"></div>
    <div class="marquee" aria-label="Partner logos">
      <div class="marquee-track">
        {% for partner in site.data.partners %}
        <div class="marquee-item">
          <img class="marquee-logo" src="{{ partner.logo }}" alt="{{ partner.name }}" width="200" height="40" loading="lazy">
        </div>
        {% endfor %}
        {% for partner in site.data.partners %}
        <div class="marquee-item" aria-hidden="true">
          <img class="marquee-logo" src="{{ partner.logo }}" alt="" width="200" height="40" loading="lazy">
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="marquee-fade marquee-fade--right" aria-hidden="true"></div>
  </div>
</section>
