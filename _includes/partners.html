<section class="section" id="parceiros">
  <h2 class="section-title">Parceiros</h2>
  <div class="partners">
    {% for partner in site.data.partners %}
    <div class="partner">
      <span class="partner-name">{{ partner.name }}</span>
      <span class="partner-tag">{{ partner.tag }}</span>
    </div>
    {% endfor %}
  </div>
</section>
