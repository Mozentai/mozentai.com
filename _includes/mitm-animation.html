<div class="mitm-scene" aria-hidden="true">
  <svg class="mitm-svg" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="mitm-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Forward lane -->
    <line x1="130" y1="52" x2="370" y2="52" class="mitm-wire"/>
    <line x1="530" y1="52" x2="770" y2="52" class="mitm-wire"/>

    <!-- Return lane -->
    <line x1="770" y1="88" x2="530" y2="88" class="mitm-wire mitm-wire--dim"/>
    <line x1="370" y1="88" x2="130" y2="88" class="mitm-wire mitm-wire--dim"/>

    <!-- Intercept tap -->
    <line x1="450" y1="62" x2="450" y2="108" class="mitm-wire mitm-wire--tap"/>

    <!-- Client -->
    <g class="mitm-node">
      <rect x="70" y="32" width="56" height="40" rx="4" class="mitm-box"/>
      <rect x="78" y="40" width="40" height="24" rx="2" class="mitm-screen"/>
      <text x="98" y="82" class="mitm-label">CLIENT</text>
    </g>

    <!-- Server -->
    <g class="mitm-node">
      <rect x="774" y="28" width="52" height="48" rx="4" class="mitm-box"/>
      <line x1="782" y1="40" x2="818" y2="40" class="mitm-server-line"/>
      <line x1="782" y1="50" x2="818" y2="50" class="mitm-server-line"/>
      <line x1="782" y1="60" x2="818" y2="60" class="mitm-server-line"/>
      <circle cx="812" cy="66" r="2" class="mitm-led"/>
      <text x="800" y="92" text-anchor="middle" class="mitm-label">SERVER</text>
    </g>

    <!-- MITM attacker -->
    <g class="mitm-attacker" filter="url(#mitm-glow)">
      <polygon points="450,24 478,44 478,72 450,88 422,72 422,44" class="mitm-hex"/>
      <circle cx="450" cy="52" r="10" class="mitm-eye-ring"/>
      <circle cx="450" cy="52" r="4" class="mitm-eye"/>
      <line x1="438" y1="64" x2="426" y2="76" class="mitm-arm"/>
      <line x1="462" y1="64" x2="474" y2="76" class="mitm-arm"/>
      <text x="450" y="108" text-anchor="middle" class="mitm-label mitm-label--alert">MITM</text>
    </g>

    <!-- Forward packets: client → mitm -->
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 130 52 L 370 52"/>
    </circle>
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.7s" path="M 130 52 L 370 52"/>
    </circle>
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.4s" path="M 130 52 L 370 52"/>
    </circle>
    <rect width="6" height="4" rx="1" class="pkt pkt--fwd pkt--block">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="2.1s" path="M 130 52 L 370 52"/>
    </rect>

    <!-- Forward packets: mitm → server -->
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.35s" path="M 530 52 L 770 52"/>
    </circle>
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.05s" path="M 530 52 L 770 52"/>
    </circle>
    <circle r="3" class="pkt pkt--fwd">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.75s" path="M 530 52 L 770 52"/>
    </circle>
    <rect width="6" height="4" rx="1" class="pkt pkt--fwd pkt--block">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="2.45s" path="M 530 52 L 770 52"/>
    </rect>

    <!-- Intercepted copies (peel off at MITM) -->
    <circle r="2.5" class="pkt pkt--stolen">
      <animateMotion dur="1.6s" repeatCount="indefinite" begin="0.5s" path="M 450 58 L 450 100"/>
    </circle>
    <circle r="2.5" class="pkt pkt--stolen">
      <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.3s" path="M 450 58 L 450 100"/>
    </circle>
    <circle r="2.5" class="pkt pkt--stolen">
      <animateMotion dur="1.6s" repeatCount="indefinite" begin="2.1s" path="M 450 58 L 450 100"/>
    </circle>

    <!-- Return packets -->
    <circle r="2.5" class="pkt pkt--ret">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M 770 88 L 530 88"/>
    </circle>
    <circle r="2.5" class="pkt pkt--ret">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0.85s" path="M 770 88 L 530 88"/>
    </circle>
    <circle r="2.5" class="pkt pkt--ret">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0.4s" path="M 370 88 L 130 88"/>
    </circle>
    <circle r="2.5" class="pkt pkt--ret">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="1.25s" path="M 370 88 L 130 88"/>
    </circle>
  </svg>
</div>
