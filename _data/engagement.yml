headline: How We Work
lead: Flexible engagement models built for how your team actually operates.

models:
  - name: Staff Augmentation
    description: Our engineers integrate directly into your existing team. Same standups, same sprints, same codebase.
    icon: "&#x276F;"

  - name: Dedicated Team
    description: A full engineering squad assigned to your product. They own delivery end to end, from review to production.
    icon: "&#x2726;"

  - name: Project-Based
    description: Scoped engagements with clear deliverables. Audits, architecture reviews, or build sprints, delivered on a fixed timeline.
    icon: "&#x25A0;"
