  - code: AZ2
    name: CITC Certified Azure Engineer II
    abbr: CITC CAZ-II
    description: Holders demonstrate intermediate competency in Azure. They can architect with AKS, serverless, Cosmos DB, Bicep, and DevOps pipelines.

  - code: AZ3
    name: CITC Certified Azure Engineer III
    abbr: CITC CAZ-III
    description: Holders demonstrate advanced competency in Azure. They can design enterprise landing zones, data platforms, and multi-region architectures with CAF.

  - code: AZX
    name: CITC Certified Azure Specialist
    abbr: CITC CAZS
    description: Holders demonstrate specialist-level mastery of Azure. They can engineer enterprise governance, hybrid with Arc, and platform automation at scale.

  # Heroku
  - code: HK1
