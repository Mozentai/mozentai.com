  - code: HK2
    name: CITC Certified Heroku Engineer II
    abbr: CITC CHE-II
    description: Holders demonstrate intermediate competency in Heroku. They can manage Private Spaces, container deploys, CI/CD, and performance optimization.

  - code: HK3
    name: CITC Certified Heroku Engineer III
    abbr: CITC CHE-III
    description: Holders demonstrate advanced competency in Heroku. They can architect enterprise deployments, custom buildpacks, and multi-region strategies.

  - code: HKX
    name: CITC Certified Heroku Specialist
    abbr: CITC CHS
    description: Holders demonstrate specialist-level mastery of Heroku. They can engineer enterprise platforms, compliance architectures, and large-scale migrations.

  # Firebase
  - code: FB1
    name: CITC Certified Firebase Engineer I
    abbr: CITC CFE-I
    description: Holders demonstrate foundational competency in Firebase. They can build apps with Authentication, Firestore, Hosting, Storage, and security rules.

  - code: FB2
    name: CITC Certified Firebase Engineer II
    abbr: CITC CFE-II
    description: Holders demonstrate intermediate competency in Firebase. They can build with Cloud Functions, advanced rules, Remote Config, and the Emulator Suite.

  - code: FB3
    name: CITC Certified Firebase Engineer III
    abbr: CITC CFE-III
    description: Holders demonstrate advanced competency in Firebase. They can design data models at scale, integrate with GCP, and build real-time multi-user systems.

  - code: FBX
    name: CITC Certified Firebase Specialist
