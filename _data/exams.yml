# CITC exams and base curriculums.
# Do not render on the public site.
# Performance type is generated from the sitting score in product code.
# Hours are estimates. Specialist (X) requires cumulative mastery.

modes:
  - id: questionnaire
    label: Questionnaire
  - id: instructor
    label: Instructor
    note: Candidate schedules the sitting and takes it with a tester.

naming:
  python: P
  cybersec: C
  java: J
  go: G
  math: M
  logic: L
  cs: CS
  se: SE
  specialist: X

