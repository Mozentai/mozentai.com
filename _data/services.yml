- name: Auditing
  description: We audit infrastructure, applications, and processes so you know where you stand. Successful completion earns a one-year Mozentai certification.
  icon: "&#x25C8;"

- name: Hardening
  description: We lock down systems before gaps become incidents, including OS hardening, network segmentation, identity controls, and secure configuration baselines.
  icon: "&#x25C7;"

- name: Engineering
  description: Embed our engineers directly into your team. They write production code, from architecture to review. Hands-on developers who ship.
  icon: "&#x25CA;"

- name: CITC
  description: Council of Information Technology & Computing. A professional credential for software engineers, the computing counterpart to the councils that license engineers and physicians. Practitioners hold recognized standing in their field. Teams can require it.
  icon: "&#x25C6;"
